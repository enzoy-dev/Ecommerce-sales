name: Validate analysis

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
      JUPYTER_PLATFORM_DIRS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute notebook and its validation checks
        run: >-
          jupyter nbconvert --to notebook --execute notebooks/01_analysis.ipynb
          --output analysis-validated.ipynb --output-dir "$RUNNER_TEMP"
          --ExecutePreprocessor.timeout=180
      - name: Upload executed analysis
        uses: actions/upload-artifact@v4
        with:
          name: validated-analysis
          path: |
            ${{ runner.temp }}/analysis-validated.ipynb
            reports/
          if-no-files-found: error
